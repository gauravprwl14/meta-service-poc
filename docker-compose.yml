version: "3.8"

services:
  # Node.js application
  app:
    build: .
    container_name: todo-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/todo-app
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: >
      sh -c "chmod +x ./scripts/*.sh &&
             npm run dev"
    depends_on:
      - mongodb

  # MongoDB service
  mongodb:
    image: mongo:latest
    container_name: todo-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
    driver: local
